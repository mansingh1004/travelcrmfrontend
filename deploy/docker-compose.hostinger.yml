name: travelcrm-frontend

services:
  web:
    image: ${TRAVELCRM_FRONTEND_IMAGE:?Set TRAVELCRM_FRONTEND_IMAGE before running docker compose}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_BIND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
