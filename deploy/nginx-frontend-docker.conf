# Frontend vhost for Docker Compose deployment.
# Keep the backend/API vhost separate on api.mytripsafar.com.

server {
    listen 80;
    server_name mytripsafar.com www.mytripsafar.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name mytripsafar.com www.mytripsafar.com;

    ssl_certificate     /etc/letsencrypt/live/mytripsafar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mytripsafar.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 15M;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
