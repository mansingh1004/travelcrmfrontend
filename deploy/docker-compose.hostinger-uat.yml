# ===================================================================
# TravelCRM frontend - UAT stack, same VPS as production.
#
# Differs from docker-compose.hostinger.yml only in project name and port:
#   project travelcrm-frontend-uat (not travelcrm-frontend) so `up -d` here
#   cannot tear down the production SPA container, and 127.0.0.1:5174 because
#   production owns 5173.
#
# nginx routes test.mytripsafar.com -> 127.0.0.1:5174.
# ===================================================================

name: travelcrm-frontend-uat

services:
  web:
    image: ${TRAVELCRM_FRONTEND_IMAGE:?Set TRAVELCRM_FRONTEND_IMAGE before running docker compose}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_BIND_PORT:-5174}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
