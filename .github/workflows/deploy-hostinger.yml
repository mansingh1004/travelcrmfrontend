name: Deploy Frontend to Hostinger VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  IMAGE_NAME: travelcrm-frontend
  HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || vars.HOSTINGER_PORT || '22' }}
  HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST || vars.HOSTINGER_HOST || '187.127.159.81' }}
  HOSTINGER_APP_DIR: ${{ vars.HOSTINGER_FE_APP_DIR || '/opt/travelcrm-frontend' }}
  VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.mytripsafar.com/api' }}

jobs:
  build:
    name: Build frontend bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify production API URL was compiled
        shell: bash
        run: |
          if ! grep -R "$VITE_API_URL" dist >/dev/null; then
            echo "VITE_API_URL was not found in the built bundle." >&2
            exit 1
          fi
          if grep -R "localhost:8080" dist >/dev/null; then
            echo "Built bundle still contains localhost:8080." >&2
            exit 1
          fi

  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          dockerhub_username="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]')"
          if [ -z "$dockerhub_username" ]; then
            echo "::error::Missing DOCKERHUB_USERNAME secret"
            exit 1
          fi
          image_uri="docker.io/${dockerhub_username}/${IMAGE_NAME}:${GITHUB_SHA}"
          latest_uri="docker.io/${dockerhub_username}/${IMAGE_NAME}:latest"
          printf 'image_uri=%s\n' "$image_uri" >> "$GITHUB_OUTPUT"
          printf 'latest_uri=%s\n' "$latest_uri" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          dockerhub_username="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]')"
          dockerhub_token="$(printf '%s' "$DOCKERHUB_TOKEN" | tr -d '\r\n')"
          if [ -z "$dockerhub_username" ] || [ -z "$dockerhub_token" ]; then
            echo "::error::Missing Docker Hub credentials"
            exit 1
          fi
          printf '%s' "$dockerhub_token" | docker login docker.io -u "$dockerhub_username" --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          tags: |
            ${{ steps.image.outputs.image_uri }}
            ${{ steps.image.outputs.latest_uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on Hostinger VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout deploy files
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER || vars.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS || vars.HOSTINGER_KNOWN_HOSTS }}
        run: |
          : "${HOSTINGER_HOST:?Missing HOSTINGER_HOST secret or variable}"
          : "${HOSTINGER_USER:?Missing HOSTINGER_USER secret or variable}"
          : "${HOSTINGER_SSH_KEY:?Missing HOSTINGER_SSH_KEY secret}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key
          if [ -n "${HOSTINGER_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload compose files
        shell: bash
        env:
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER || vars.HOSTINGER_USER }}
        run: |
          remote="${HOSTINGER_USER}@${HOSTINGER_HOST}"
          ssh_opts=(-i ~/.ssh/hostinger_key -p "$HOSTINGER_PORT" -o StrictHostKeyChecking=yes)
          scp_opts=(-i ~/.ssh/hostinger_key -P "$HOSTINGER_PORT" -o StrictHostKeyChecking=yes)
          ssh "${ssh_opts[@]}" "$remote" "mkdir -p '$HOSTINGER_APP_DIR'"
          scp "${scp_opts[@]}" \
            deploy/docker-compose.hostinger.yml \
            deploy/deploy-hostinger.sh \
            "$remote:$HOSTINGER_APP_DIR/"

      - name: Run remote deployment
        shell: bash
        env:
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER || vars.HOSTINGER_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          remote="${HOSTINGER_USER}@${HOSTINGER_HOST}"
          ssh_opts=(-i ~/.ssh/hostinger_key -p "$HOSTINGER_PORT" -o StrictHostKeyChecking=yes)
          dockerhub_username="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]')"
          dockerhub_token="$(printf '%s' "$DOCKERHUB_TOKEN" | tr -d '\r\n')"
          if [ -z "$dockerhub_username" ] || [ -z "$dockerhub_token" ]; then
            echo "::error::Missing Docker Hub credentials"
            exit 1
          fi
          travelcrm_frontend_image="docker.io/${dockerhub_username}/${IMAGE_NAME}:${GITHUB_SHA}"
          app_dir_q="$(printf '%q' "$HOSTINGER_APP_DIR")"
          image_q="$(printf '%q' "$travelcrm_frontend_image")"
          docker_user_q="$(printf '%q' "$dockerhub_username")"
          docker_token_q="$(printf '%q' "$dockerhub_token")"
          ssh "${ssh_opts[@]}" "$remote" \
            "APP_DIR=$app_dir_q TRAVELCRM_FRONTEND_IMAGE=$image_q DOCKERHUB_USERNAME=$docker_user_q DOCKERHUB_TOKEN=$docker_token_q bash -s" <<'REMOTE_DEPLOY'
          set -euo pipefail
          cd "$APP_DIR"
          chmod +x deploy-hostinger.sh
          ./deploy-hostinger.sh
          REMOTE_DEPLOY
